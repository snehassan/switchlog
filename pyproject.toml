[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "switchlog"
version = "0.1.0"
description = "Save and resume context snapshots when you switch tasks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sneha Hassan" }]
dependencies = ["platformdirs>=4"]
[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]
[project.scripts]
switchlog = "switchlog.cli:main"
switchlog-gui = "switchlog.gui:main"
[tool.hatch.build.targets.wheel]
packages = ["src/switchlog"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.pytest.ini_options]
testpaths = ["tests"]